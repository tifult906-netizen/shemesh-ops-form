[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shemesh-ops"
version = "0.1.0"
description = "Shemesh sales-rep operation form (טופס תפעול) generator"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
